name: Test and package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '.[dev]' build
      - run: pytest -q
      - run: python -m proofbound.benchmark.suite
      - run: python -m build
      - run: node --check proofbound/web/static/app.js
      - run: node --test tests/proxy.test.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proofbound .
