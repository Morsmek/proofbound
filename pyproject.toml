[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofbound"
version = "0.1.0"
description = "Evidence-first personal operations agent with verifiable action ledger, policy-governed execution, and reversible source-linked memory."
readme = "README.md"
authors = [
    { name = "Proofbound Maintainers", email = "maintainers@proofbound.org" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
browser = [
    "beautifulsoup4>=4.12.0",
]
all = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
proofbound = "proofbound.cli.main:main"
